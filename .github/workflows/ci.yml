# =============================================================================
# CI — the per-diff invariant gate. Every pull request (and every push to
# main) must re-prove the three properties the project is built around:
#
#   correctness   build+test on every supported toolchain, ASan+UBSan over
#                 the full suite set, and a bounded fuzz pass over the four
#                 untrusted-input arms (SMF / SEEU / SDS / compile-of-SMF)
#   determinism   the bitwise-invariance suites re-run under SEEML_THREADS
#                 in {1, 3, 8}, so every "same bits at any width" assertion
#                 executes against genuinely different worker-pool shapes
#   boundedness   the seeded distribution-bound and concurrency-race tests
#                 run in every matrix cell; the slow ThreadSanitizer pass
#                 over the same races lives in nightly.yml
#
# The suites themselves carry the assertions; CI's job is to run them on
# configurations a developer machine does not (other OS/compilers,
# sanitizers, varied pool widths) and to refuse the merge when any fails.
# =============================================================================

name: CI

# Every run step names its shell: GitHub then runs `bash --noprofile --norc
# -eo pipefail {0}`, so a failing producer fails its pipeline (CR3 #144, F00 /
# F01); the unnamed default is `bash -e {0}`, errexit without pipefail.
defaults:
  run:
    shell: bash

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image: pinned to ubuntu-24.04, not ubuntu-latest. On 2026-11-11
# `ubuntu-latest` became Ubuntu 26.04, where apt.llvm.org publishes no
# llvm-toolchain-19 repository (404 on its Release file) and setup-python
# offers no 3.9 — every Linux job failed at toolchain setup, on main's
# nightly too. Move the pin when the toolchain steps are ported.
jobs:
  fuzz-smoke:
    name: fuzz (90s smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: cmake -S . -B build-fuzz -DSEEML_FUZZ=ON
      - name: Build harness
        run: cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_formats
      - name: Fuzz
        # Below the job's limit: a run that outlives it is killed here, as
        # a failed step the upload below still follows.
        timeout-minutes: 8
        run: |
          # One valid input per arm and per plan family, so the first unit
          # already runs an accepted plan (CR3 #208).
          rm -rf corpus
          cp -r test/fuzz/seeds corpus
          # -timeout / -rss_limit_mb: the harness bounds every unit's work
          # (milliseconds here; its caps allow seconds at -O0 under ASan),
          # so a unit past 25 s or 2 GiB is a finding libFuzzer reports and
          # writes out — its defaults (1200 s) outlive the job (CR3 #207).
          ./build-fuzz/seeml_fuzz_formats -runs=0 -max_total_time=90 \
            -timeout=25 -rss_limit_mb=2048 \
            -print_final_stats=1 -print_coverage=1 corpus 2>&1 | tee fuzz.log
          test "${PIPESTATUS[0]}" -eq 0
          # The gate names what must be reached (CR3 #208): a function is
          # reached when libFuzzer prints it COVERED with non-zero hits.
          # The gate this replaces grepped "COVERED_FUNC.*runtime/", which
          # every UNCOVERED_FUNC line under runtime/ satisfies.
          missed=0
          gate() {  # $1: what it is; $2: the function, an extended regex
            if ! grep -Eq "^COVERED_FUNC: hits: [1-9][0-9]* edges: [0-9]+/[0-9]+ $2(\[abi:[a-z0-9]+\])?\(" fuzz.log; then
              echo "::error::the fuzzer never reached $1 ($2)"
              grep -E " $2(\[abi:[a-z0-9]+\])?\(" fuzz.log | head -n 3 || true
              missed=1
            fi
          }
          gate "the execution of an accepted plan" '\(anonymous namespace\)::ExecuteOnce'
          # (The loader validates through DescribeInstruction; the public
          # ValidateInstruction is the tests' entry. Both run the Impl.)
          gate "the validator" 'seeml::update_rt::\(anonymous namespace\)::ValidateInstructionImpl'
          gate "the train loop" 'seeml::update_rt::UpdateEngine::Train'
          gate "the instruction dispatch" 'seeml::update_rt::UpdateEngine::ExecuteRange'
          gate "a completed compile" 'seeml::update::AssemblePlan'
          gate "the tokenizer section loader" 'seeml::tokenizer::ByteLevelBpe::Load'
          gate "the JSONL reader" 'seeml::tokenizer::DocumentsFromJsonl'
          gate "the text ingest" 'seeml::tokenizer::Ingest'
          gate "the recipe file parser" 'seeml::update::recipe::ParseRecipeFile'
          gate "the export report reader" 'seeml::update::ReadExportReport'
          test "$missed" -eq 0
      # CR3 #208, acceptance 2. Ninety seconds of libFuzzer do not find one
      # opcode's missing bounds rule: with kAddBias's destination rule
      # removed, three runs of the step above passed (25,772-28,179 units
      # each, 2026-11-24) — the corpus is a thousand units by then, and the
      # plan seeds are fourteen of them. The replay suite's operand pass is
      # the same plan-aware edit (test/fuzz/plan_mutate.h) made 57,344
      # times over those fourteen seeds, in this job's sanitizer build: the
      # planted rule ends it in an AddressSanitizer report.
      - name: Operand sweep (plan-aware edits over the plan seeds)
        timeout-minutes: 6
        run: |
          cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_replay_test
          SEEML_FUZZ_MUTATIONS=2048 ./build-fuzz/seeml_fuzz_replay_test \
            --filter=PlanOperandEdits 2>&1 | tee -a fuzz.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Keep the log's tail
        if: failure() || cancelled()
        run: tail -n 400 fuzz.log > fuzz-tail.log || true
      - name: Upload findings
        # A cancelled job is not a failed one, and libFuzzer names a
        # finding by its kind (CR3 #207): every prefix, and the log's tail.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
            slow-unit-*
            leak-*
            fuzz-tail.log
            corpus
          if-no-files-found: ignore

  # --- Correctness: the product contract, end to end -------------------------
  # The strongest claim in the docs — "the emitted package builds and runs
  # with no access to this repository" — exercised for real: PyTorch export
  # -> compile -> the package's own generated build.sh -> model_update
  # training, gating, and committing on-device style. Then the determinism
  # invariant at the artifact level: a fully serial re-run must commit a
  # BITWISE-identical model. Outcome-robust: if the seeded demo's gate
  # rejects (exit 3), the run is retried with --force — the invariants
  # under test are build/run/commit/determinism, not the demo's luck.
