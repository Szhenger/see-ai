# =============================================================================
# CI — the per-diff invariant gate. Every pull request (and every push to
# main) must re-prove the three properties the project is built around:
#
#   correctness   build+test on every supported toolchain, ASan+UBSan over
#                 the full suite set, and a bounded fuzz pass over the four
#                 untrusted-input arms (SMF / SEEU / SDS / compile-of-SMF)
#   determinism   the bitwise-invariance suites re-run under SEEML_THREADS
#                 in {1, 3, 8}, so every "same bits at any width" assertion
#                 executes against genuinely different worker-pool shapes
#   boundedness   the seeded distribution-bound and concurrency-race tests
#                 run in every matrix cell; the slow ThreadSanitizer pass
#                 over the same races lives in nightly.yml
#
# The suites themselves carry the assertions; CI's job is to run them on
# configurations a developer machine does not (other OS/compilers,
# sanitizers, varied pool widths) and to refuse the merge when any fails.
# =============================================================================

name: CI

# Every run step names its shell: GitHub then runs `bash --noprofile --norc
# -eo pipefail {0}`, so a failing producer fails its pipeline (CR3 #144, F00 /
# F01); the unnamed default is `bash -e {0}`, errexit without pipefail.
defaults:
  run:
    shell: bash

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push supersedes its older run. A push to main does
# not: every merged commit keeps its own verdict (review 2026-11-25 — two
# merges a minute apart used to leave the first one's run cancelled, and
# main with commits no CI run had finished on). The group is why, not only
# the flag: a group admits one running and one PENDING run, and a third run
# replaces the pending one whatever cancel-in-progress says — so under one
# group for the branch, three merges inside one run's sixteen minutes would
# still lose the middle one. A push's group is its commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner image: pinned to ubuntu-24.04, not ubuntu-latest. On 2026-11-11
# `ubuntu-latest` became Ubuntu 26.04, where apt.llvm.org publishes no
# llvm-toolchain-19 repository (404 on its Release file) and setup-python
# offers no 3.9 — every Linux job failed at toolchain setup, on main's
# nightly too. Move the pin when the toolchain steps are ported.
jobs:
  # --- Correctness: the supported-toolchain matrix ---------------------------
  # README promises clang or gcc, CMake optional: the shell driver is the
  # canonical build here. macOS additionally exercises the ObjC++ Metal
  # harness (the suite degrades to a note when the runner has no device).
  #
  # Linux toolchains are pinned explicitly (g++-14, clang++-19 from
  # apt.llvm.org): the code is std::expected-native, and libstdc++ hides
  # <expected> behind __cpp_concepts >= 202002L — a macro Clang defines
  # only from 19 (Ubuntu's clang 18.1 + noble's pre-14.1 libstdc++ can
  # never see the template). Pinning turns runner-image rotations from
  # red builds into non-events.
  #
  # Every toolchain-install step is bounded (wget read-timeout, 3 retries,
  # step timeout-minutes): apt.llvm.org throttles the Actions IP space at
  # times, and an unbounded fetch turns that stall into the whole job
  # budget (observed 2026-08-19: four jobs dead at their ceilings without
  # compiling a line). A stall now costs minutes and usually self-heals.
  #
  # Each install step first drops the runner image's third-party apt
  # sources (Google Chrome, Microsoft): none are needed, and a stale index
  # on one fails every apt-get update, including the one inside llvm.sh.
  build-and-test:
    name: test (${{ matrix.os }}, ${{ matrix.cxx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++-14 }
          - { os: ubuntu-24.04, cxx: clang++-19 }
          - { os: macos-latest, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CXX: ${{ matrix.cxx }}
      # The measurement code is built where it is tested (2026-09-24
      # review, N44 / N43): SEEML_BENCH compiles the runtime with the
      # per-phase step clock and links seeml-bench; SEEML_ACCELERATE (an
      # Apple-only switch build.sh ignores elsewhere) compiles the relaxed
      # GEMMs' Accelerate path, which the system suite then exercises.
      SEEML_BENCH: "1"
      SEEML_ACCELERATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            sudo apt-get update -q && sudo apt-get install -y -q g++-14 &&
              wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "toolchain install attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Toolchain version
        run: $CXX --version
      # S8 #154: the formatter is the rule (STYLE.md section 1). The check
      # is STYLE.md's command with --dry-run -Werror in place of -i, over
      # the same file list; .clang-format-ignore holds the exclusions. One
      # leg is enough, and it must be clang-format 19 -- the version the
      # tree was formatted with (llvm.sh's "19 all" installs it; another
      # release lays some constructs out differently). xargs exits 123
      # when any batch reports a file the formatter would change.
      - name: clang-format --dry-run -Werror
        if: matrix.cxx == 'clang++-19'
        run: |
          clang-format-19 --version
          git ls-files -z '*.cc' '*.h' '*.mm' |
            xargs -0 clang-format-19 --dry-run -Werror
      - name: Build (shell driver, no CMake)
        run: sh build/build.sh
      - name: Run every suite
        run: |
          fail=0
          for t in build/seeml_*_test; do
            echo "== $t"
            "$t" 2>&1 | tee -a suites.log
            test "${PIPESTATUS[0]}" -eq 0 || fail=1
          done
          exit $fail
      # Review 2026-11-25: a skipped C++ test is reported and counted, and
      # nothing acted on it — a macOS image with no Metal device would turn
      # the whole Metal suite into skips under a green check. On macOS the
      # one skip this runner is known to take is the relaxed-GEMM test (its
      # paravirtual GPU has no Metal 4 tensor-op library); any other is a
      # failure.
      - name: No Metal test skipped but the relaxed-kernel one (macOS)
        if: runner.os == 'macOS'
        run: |
          grep -E '^\[  SKIPPED \] [A-Za-z0-9_]+\.[A-Za-z0-9_]+: ' suites.log > skips.log || true
          cat skips.log
          if grep -v 'no Metal 4 tensor-op library' skips.log | grep -q .; then
            echo "::error::a test skipped on the macOS runner for a reason other than the missing tensor-op library"
            exit 1
          fi
      # The device's main (runtime/host/update_main.cc), built by the tree
      # in the disk mode and run end to end against the exit-code table.
      # Until 2026-11-25 only an emitted package ever compiled that file.
      - name: The runner end to end (build/seeml-model-update)
        run: sh test/system/runner_disk_mode.sh build/seeml-update-compile build/seeml-model-update "$PWD"
      # No .mm file ran under a sanitizer anywhere (the ASan + UBSan job is
      # Linux). The Metal backend and its suite, and the engine suite that
      # drives it, built with both here and run on the runner's GPU.
      - name: Metal backend under ASan + UBSan (macOS)
        if: runner.os == 'macOS'
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-san -DSEEML_SANITIZE="address;undefined"
          cmake --build build-san -j "$(sysctl -n hw.ncpu)" --target seeml_metal_backend_test seeml_update_engine_test
          ./build-san/seeml_metal_backend_test
          ./build-san/seeml_update_engine_test
      # S7 #153: seeml-bench rows carry the runtime screen model_update prints.
      # This job builds seeml-bench (SEEML_BENCH=1), so the test must run, not
      # skip; the test is standard-library Python.
      - name: seeml-bench rows carry the runtime screen
        run: |
          python3 -m unittest discover -s test/tool -p 'bench_runtime_test.py' -v 2>&1 | tee bench_rt.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -q "skipped" bench_rt.log
      # S8 #154: every built tool exits 2 on a bad command line and keeps 1
      # for work that failed. All six tools exist in this job (the e2e job
      # builds no bench), so no test of the file may skip.
      - name: The tools' exit-code contract (all six, nothing skipped)
        run: |
          python3 -m unittest discover -s test/tool -p 'cli_exit_codes_test.py' -v 2>&1 | tee cli_exit.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -q "skipped" cli_exit.log

  # --- Determinism: identical bits at every pool width -----------------------
  # SEEML_THREADS pins the global worker pool. The bitwise assertions inside
  # the suites (plan bytes, persist segments, kernel outputs, hashes) then
  # execute serially, at an odd width, and wide — any scheduling-dependent
  # numeric would trip at least one width.
  determinism:
    name: determinism (widths 1/3/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Build
        run: sh build/build.sh
      - name: Run all suites at each width
        run: |
          fail=0
          for w in 1 3 8; do
            echo "==== SEEML_THREADS=$w"
            for t in build/seeml_*_test; do
              SEEML_THREADS=$w "$t" > /tmp/out.log 2>&1 || {
                echo "FAILED at width $w: $t"
                cat /tmp/out.log
                fail=1
              }
            done
          done
          exit $fail

  # --- Correctness: Address + UndefinedBehavior sanitizers -------------------
  # The bug class the reviews kept surfacing (e.g. a float->int8 cast of
  # clamp(NaN)) is exactly what UBSan turns from silent corruption into a
  # red build. Uses the CMake path, which carries the sanitizer plumbing.
  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CXX: clang++-19
      ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSEEML_SANITIZE="address;undefined"
      - name: Build
        run: cmake --build build-san -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  # --- Correctness: bounded fuzz over the untrusted-input arms ---------------
  # 90 seconds per PR is a smoke pass, not a campaign (nightly runs the long
  # one): it still catches shallow regressions in the reader/validator
  # rejection paths that a hand-written test didn't anticipate. It starts
  # from the checked-in seed corpus (test/fuzz/seeds, CR3 #208) — from an
  # empty one, ninety seconds never built a plan that passes the seal and
  # the contract, and the job passed having executed nothing.
  fuzz-smoke:
    name: fuzz (90s smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: cmake -S . -B build-fuzz -DSEEML_FUZZ=ON
      - name: Build harness
        run: cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_formats
      - name: Fuzz
        # Below the job's limit: a run that outlives it is killed here, as
        # a failed step the upload below still follows.
        timeout-minutes: 8
        run: |
          # One valid input per arm and per plan family, so the first unit
          # already runs an accepted plan (CR3 #208).
          rm -rf corpus
          cp -r test/fuzz/seeds corpus
          # -timeout / -rss_limit_mb: the harness bounds every unit's work
          # (milliseconds here; its caps allow seconds at -O0 under ASan),
          # so a unit past 25 s or 2 GiB is a finding libFuzzer reports and
          # writes out — its defaults (1200 s) outlive the job (CR3 #207).
          ./build-fuzz/seeml_fuzz_formats -max_total_time=90 \
            -timeout=25 -rss_limit_mb=2048 \
            -print_final_stats=1 -print_coverage=1 corpus 2>&1 | tee fuzz.log
          test "${PIPESTATUS[0]}" -eq 0
          # The gate names what must be reached (CR3 #208): a function is
          # reached when libFuzzer prints it COVERED with non-zero hits.
          # The gate this replaces grepped "COVERED_FUNC.*runtime/", which
          # every UNCOVERED_FUNC line under runtime/ satisfies.
          missed=0
          gate() {  # $1: what it is; $2: the function, an extended regex
            if ! grep -Eq "^COVERED_FUNC: hits: [1-9][0-9]* edges: [0-9]+/[0-9]+ $2(\[abi:[a-z0-9]+\])?\(" fuzz.log; then
              echo "::error::the fuzzer never reached $1 ($2)"
              grep -E " $2(\[abi:[a-z0-9]+\])?\(" fuzz.log | head -n 3 || true
              missed=1
            fi
          }
          gate "the execution of an accepted plan" '\(anonymous namespace\)::ExecuteOnce'
          # (The loader validates through DescribeInstruction; the public
          # ValidateInstruction is the tests' entry. Both run the Impl.)
          gate "the validator" 'seeml::update_rt::\(anonymous namespace\)::ValidateInstructionImpl'
          gate "the train loop" 'seeml::update_rt::UpdateEngine::Train'
          gate "the instruction dispatch" 'seeml::update_rt::UpdateEngine::ExecuteRange'
          gate "a completed compile" 'seeml::update::AssemblePlan'
          gate "the tokenizer section loader" 'seeml::tokenizer::ByteLevelBpe::Load'
          gate "the JSONL reader" 'seeml::tokenizer::DocumentsFromJsonl'
          gate "the text ingest" 'seeml::tokenizer::Ingest'
          gate "the recipe file parser" 'seeml::update::recipe::ParseRecipeFile'
          gate "the export report reader" 'seeml::update::ReadExportReport'
          test "$missed" -eq 0
      # CR3 #208, acceptance 2. Ninety seconds of libFuzzer do not reliably
      # find one opcode's missing bounds rule: with kAddBias's destination
      # rule removed, the step above found it in one run of four
      # (2026-11-24; one of two with the plan-aware mutator as it is now) —
      # the corpus is a thousand units within the run, and the plan seeds
      # are fourteen of them. The replay suite's operand pass is
      # the same plan-aware edit (test/fuzz/plan_mutate.h) made 57,344
      # times over those fourteen seeds, in this job's sanitizer build: the
      # planted rule ends it in an AddressSanitizer report.
      - name: Operand sweep (plan-aware edits over the plan seeds)
        timeout-minutes: 6
        run: |
          cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_replay_test
          SEEML_FUZZ_MUTATIONS=2048 ./build-fuzz/seeml_fuzz_replay_test \
            --filter=PlanOperandEdits 2>&1 | tee -a fuzz.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Keep the log's tail
        if: failure() || cancelled()
        run: tail -n 400 fuzz.log > fuzz-tail.log || true
      - name: Upload findings
        # A cancelled job is not a failed one, and libFuzzer names a
        # finding by its kind (CR3 #207): every prefix, and the log's tail.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
            slow-unit-*
            leak-*
            fuzz-tail.log
            corpus
          if-no-files-found: ignore

  # --- Correctness: the product contract, end to end -------------------------
  # The strongest claim in the docs — "the emitted package builds and runs
  # with no access to this repository" — exercised for real: PyTorch export
  # -> compile -> the package's own generated build.sh -> model_update
  # training, gating, and committing on-device style. Then the determinism
  # invariant at the artifact level: a fully serial re-run must commit a
  # BITWISE-identical model. Outcome-robust: if the seeded demo's gate
  # rejects (exit 3), the run is retried with --force — the invariants
  # under test are build/run/commit/determinism, not the demo's luck.
  e2e-package:
    name: e2e (export -> compile -> package -> update)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      # The pinned build-host stack (tool/requirements-pinned.txt): CPython
      # 3.14.7 with torch 2.14 from the CPU wheel index and NumPy 2.5 from
      # PyPI. --extra-index-url, not --index-url: the PyTorch mirror only
      # carries the NumPy releases torch itself was built against, so an
      # exact NumPy pin must be free to resolve from PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: tool/requirements-pinned.txt
      - name: Install the pinned exporter stack (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r tool/requirements-pinned.txt
      # The parity stack (review 2026-11-25): with it the exporter's
      # transformers parity test (a synthetic Llama, no download) and the
      # frontier runner's tokenizer-training tests run here instead of
      # skipping everywhere. The versions are the ones the suite was last
      # run green on beside the pinned stack. The SmolLM-135M tokenizer
      # parity test still needs a cached checkpoint and stays tier 2.
      - name: Install the parity stack (transformers, tokenizers)
        run: pip install "transformers==5.17.0" "tokenizers==0.23.2"
      - name: Export the demo model + corpus
        run: python3 -W error tool/export_model.py --demo out/
      - name: Build the compiler
        run: sh build/build.sh
      # The exporter suite runs after the build so its compile check (the
      # HF import must be a model the compiler accepts) runs, not skips
      # (F36). Below, every tool suite on the job that has NumPy, torch and
      # the built tools (N45): a skip that names one of those is a failure.
      - name: Exporter suite with torch (oracles, golden digests, the compile check)
        run: python3 -m unittest discover -s test/tool -p 'export_model_test.py' -v
      # The frontier executor's differential suite (P4, #78): a second,
      # independent implementation of every opcode — NumPy in f64, and
      # PyTorch — against the C++ kernels just built, instruction by
      # instruction, over the whole fixture matrix.
      - name: Frontier executor suite (differential oracle vs seeml-plan-probe)
        run: python3 -m unittest discover -s test/tool -p 'frontier_exec_test.py' -v
      # The numerics certifier (P3, #77) over plans compiled just above:
      # granted, refused, voided by a recompile, enforced by pack_update.py.
      - name: Numerics certifier suite
        run: python3 -m unittest discover -s test/tool -p 'certify_numerics_test.py' -v
      - name: Every tool suite, with nothing this job provides skipped
        run: |
          python3 -m unittest discover -s test/tool -p '*_test.py' -v 2>&1 | tee tools.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "skipped .*(NumPy|PyTorch|no built|no seeml|seeml-abi|C\+\+ (driver|toolchain)|transformers not installed|needs tokenizers \(tier 2\)|needs torch, transformers|tier 2: needs torch)" tools.log; then
            echo "::error::a tool test skipped for a dependency this job installs"
            exit 1
          fi
      - name: Compile the plan and build the emitted package
        run: |
          ./build/seeml-update-compile --source out/model.smf --out out/pkg \
            --data-batch 16 --loss xent --lora-rank 8 --lr 5e-3 --steps 300 \
            --report out/pkg/report.json --build
          test -x out/pkg/model_update
      - name: Verify the plan seal with the disassembler
        run: |
          # Not a pipe into grep -q: it closes the pipe at its first match and
          # the producer would die of SIGPIPE under pipefail.
          ./build/seeml-seeu-dump out/pkg/update_plan.seeu > out/dump.log
          grep -q "(verified)" out/dump.log
      - name: Run the update (parallel), tolerating a gate rejection
        run: |
          set +e
          out/pkg/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated.smf --seed 7 --val-frac 0.1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "gate: improved and committed"
            echo "E2E_FORCE=" >> "$GITHUB_ENV"
          elif [ "$rc" -eq 3 ]; then
            echo "gate: rejected — exercising the commit path with --force"
            out/pkg/model_update --model out/model.smf --data out/corpus.sds \
              --out out/updated.smf --seed 7 --val-frac 0.1 --force
            echo "E2E_FORCE=--force" >> "$GITHUB_ENV"
          else
            echo "model_update failed with a real error ($rc)"
            exit "$rc"
          fi
          test -s out/updated.smf
      - name: A report that cannot be written is exit 4, after the commit
        run: |
          # CR4 #145 F66: the runner used to drop the write error and exit 0
          # with a truncated report. The model is updated all the same (the
          # same bytes as the first run), and the exit code says the record
          # is missing.
          set +e
          out/pkg/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated_exit4.smf --seed 7 --val-frac 0.1 ${E2E_FORCE} \
            --report out/no-such-dir/report.json
          rc=$?
          set -e
          if [ "$rc" -ne 4 ]; then
            echo "::error::expected exit 4 for an unwritable --report, got $rc"
            exit 1
          fi
          test -s out/updated_exit4.smf
          cmp out/updated.smf out/updated_exit4.smf
      - name: Serial re-run commits a bitwise-identical model
        run: |
          # The gate's verdict is deterministic (same data, seed, and plan;
          # thread count never changes bits), so the parallel run's verdict
          # carries over — a divergence would itself be a determinism bug
          # and correctly fails this step.
          SEEML_THREADS=1 out/pkg/model_update --model out/model.smf \
            --data out/corpus.sds --out out/updated_serial.smf \
            --seed 7 --val-frac 0.1 ${E2E_FORCE}
          cmp out/updated.smf out/updated_serial.smf
          echo "serial and parallel commits are bitwise identical"
      # The Python-plane package assembler (P1, #75): the same compile with
      # --no-embed leaves no decimal TU; tool/pack_update.py embeds the plan
      # as an .incbin stub and drives the same build.sh. Acceptance: the
      # .seeu is byte-identical to the default emission, the package still
      # carries nothing Python, and the stub-built binary commits the very
      # same bytes as the decimal-built one.
      - name: Pack the plan with .incbin instead of the decimal TU
        run: |
          ./build/seeml-update-compile --source out/model.smf --out out/pkg2 \
            --data-batch 16 --loss xent --lora-rank 8 --lr 5e-3 --steps 300 \
            --report out/pkg2/report.json --no-embed
          test ! -e out/pkg2/update_plan_embedded.cc
          cmp out/pkg/update_plan.seeu out/pkg2/update_plan.seeu
          python3 tool/pack_update.py out/pkg2 --build --report out/pack.json
          test -x out/pkg2/model_update
          test -f out/pkg2/update_plan_embedded.S
          # Nothing Python ships in the package: no interpreter invoked by a
          # script the device runs, no embedding API in a source it builds,
          # no reference in the binary. Prose naming Python (a comment on the
          # exporter's rule in dataset.h) is not a dependency, so the sources
          # are grepped for the shapes a dependency takes. (The word-level
          # grep that stood here had never run: a `!`-inverted command does
          # not trip `set -e`, and it was not the step's last line.)
          if grep -rIlE '(^|[^[:alnum:]_])python[0-9.]*([[:space:]]|$)' out/pkg2 \
              --include='*.sh'; then
            echo "::error::a packaged script invokes Python"
            exit 1
          fi
          if grep -rIlE 'Python\.h|PyObject|pybind|Py_[A-Z]' out/pkg2 \
              --include='*.cc' --include='*.h' --include='*.S'; then
            echo "::error::a packaged source embeds Python"
            exit 1
          fi
          if grep -q -i python out/pkg2/model_update; then
            echo "::error::the packaged binary names Python"
            exit 1
          fi
      - name: Stub-built package commits the same bytes as the decimal one
        run: |
          out/pkg2/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated_incbin.smf --seed 7 --val-frac 0.1 ${E2E_FORCE}
          cmp out/updated.smf out/updated_incbin.smf
          echo ".incbin and decimal packages commit bitwise-identical models"
      # The disk-resident package mode (#158): from the packer's embed limit
      # a plan is not embedded at all — build.sh compiles an empty plan TU
      # and model_update maps update_plan.seeu beside itself at start-up,
      # validated exactly as an embedded plan (version gate, seal, source
      # hash). Forced here with --no-embed on the small plan: the package
      # links with no plan TU and nothing Python, the binary finds the plan
      # beside itself (not in the working directory), fails closed with
      # exit 1 when it is missing or swapped, honours --plan, and commits
      # the very same bytes as the two embedded forms.
      - name: Pack the plan in the disk mode (no embedded TU)
        run: |
          ./build/seeml-update-compile --source out/model.smf --out out/pkg3 \
            --data-batch 16 --loss xent --lora-rank 8 --lr 5e-3 --steps 300 \
            --report out/pkg3/report.json --no-embed
          cmp out/pkg/update_plan.seeu out/pkg3/update_plan.seeu
          python3 tool/pack_update.py out/pkg3 --no-embed --build --report out/pack3.json
          test -x out/pkg3/model_update
          test ! -e out/pkg3/update_plan_embedded.S
          test ! -e out/pkg3/update_plan_embedded.cc
          test ! -e out/pkg3/update_plan_none.cc
          grep -q '"mode": "disk"' out/pack3.json
          if grep -q -i python out/pkg3/model_update; then
            echo "::error::the disk-mode binary names Python"
            exit 1
          fi
      - name: Disk-mode package commits the same bytes and fails closed without its plan
        run: |
          out/pkg3/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated_disk.smf --seed 7 --val-frac 0.1 ${E2E_FORCE} \
            --report out/run_disk.json 2> out/disk.log
          grep -q "plan from '.*/out/pkg3/update_plan.seeu'" out/disk.log
          grep -q '"source": "file"' out/run_disk.json
          cmp out/updated.smf out/updated_disk.smf
          echo "disk-mode, .incbin and decimal packages commit bitwise-identical models"
          # The binary alone, away from its plan: exit 1, the mode named.
          mkdir -p out/alone && cp out/pkg3/model_update out/alone/
          set +e
          out/alone/model_update --model out/model.smf --data out/corpus.sds \
            --out out/never.smf --seed 7 2> out/alone.log
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "cannot open the update plan" out/alone.log
          grep -q "no embedded plan" out/alone.log
          test ! -e out/never.smf
          # --plan names the file wherever it is ...
          out/alone/model_update --model out/model.smf --data out/corpus.sds \
            --out out/updated_plan_flag.smf --seed 7 --val-frac 0.1 ${E2E_FORCE} \
            --plan out/pkg3/update_plan.seeu
          cmp out/updated.smf out/updated_plan_flag.smf
          # ... and a swapped file is refused before anything runs.
          set +e
          out/alone/model_update --model out/model.smf --data out/corpus.sds \
            --out out/never.smf --plan out/model.smf 2> out/swapped.log
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "bad plan magic" out/swapped.log
          test ! -e out/never.smf
      # The packer also upgrades a package from a pre-P1 compiler by
      # rewriting its one decimal compile line. Exercised against the real
      # emitter's text (this package's build.sh with the stub branch folded
      # back to the v1.2.4 line), without paying for a third runtime build:
      # the rewritten script must carry the stub line and still parse.
      - name: Packer upgrades a pre-P1 package's build.sh
        run: |
          cp -R out/pkg out/pkg_legacy
          python3 - <<'PY'
          import re
          p = "out/pkg_legacy/build.sh"
          s = open(p).read()
          legacy = re.sub(r"# The plan reaches the binary.*?\nfi\n",
                          "$CXX $FLAGS -c update_plan_embedded.cc -o update_plan_embedded.o\n",
                          s, flags=re.S)
          assert legacy != s and "update_plan_embedded.S" not in legacy
          open(p, "w").write(legacy)
          PY
          python3 tool/pack_update.py out/pkg_legacy
          grep -q '^\$CXX -c update_plan_embedded.S -o update_plan_embedded.o$' out/pkg_legacy/build.sh
          test ! -e out/pkg_legacy/update_plan_embedded.cc
          sh -n out/pkg_legacy/build.sh

  # --- Correctness: the Python plane, torch-free -----------------------------
  # Torch is deliberately not installed (heavy; the exporter's torch imports
  # are function-local): byte-compiling every tool script gates syntax and
  # top-level import errors, and the packer's suite runs under a bare
  # interpreter — it is tier 0 (stdlib only), and a stray import fails here.
  # Two interpreters: the pinned 3.14.7 and the 3.9 floor, so no tool grows
  # syntax or a stdlib API the oldest supported build host lacks.
  python-tools:
    name: python tools (${{ matrix.python }}, syntax + tiers + suites + lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every Python file in the tree
        run: python -m compileall -q -f tool test/tool test/fixtures
      # Tier 0 (pyproject.toml): the compile- and gate-path tools and the
      # shared seam import under a bare interpreter. A stray NumPy/torch
      # import fails here, not on a build host that lacks them.
      - name: Tier-0 tools import with the standard library alone
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tool")
          import autotune, bench_compare, pack_update  # noqa: E401,F401
          from seeml import formats
          heavy = {"numpy", "torch", "mlx"} & set(sys.modules)
          assert not heavy, f"tier 0 pulled in {sorted(heavy)}"
          problems = formats.check_against(formats.load_abi())
          assert not problems, problems
          PY
      - name: Packer unit tests (assembles the stub with the runner's g++)
        run: python -m unittest discover -s test/tool -p '*_test.py' -v
      - name: ruff (whole tree) and mypy --strict (tool/seeml)
        if: matrix.python == '3.14.7'
        run: |
          pip install "ruff==0.16.8" "mypy==2.3.1"
          ruff check .
          mypy

  # --- The seam between the planes (P6, #86) ----------------------------------
  # Torch-free, on every PR: the committed ABI manifest is what the headers
  # say today; the Python layouts agree with it; the golden fixtures are
  # what the exporter writes and what the C++ readers accept; and a plan the
  # compiler writes decodes identically in C++ (seeml-seeu-dump --json) and
  # in Python (frontier_exec.Plan).
  seam:
    name: plane seam (ABI manifest, golden bytes, two decoders)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Pin the Linux toolchain
        timeout-minutes: 11
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          # 2026-11-05: the image's own background apt-get held the dpkg lock for
          # over a minute; every apt-get here (llvm.sh's too) waits up to 90 s.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "90";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 180 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Install NumPy only
        run: pip install "numpy==2.5.3"
      - name: Build the tools
        run: sh build/build.sh
      - name: The committed ABI manifest is current
        run: |
          ./build/seeml-abi > abi.now.json
          diff -u tool/seeml/abi.json abi.now.json || {
            echo "::error::tool/seeml/abi.json is stale — run build/seeml-abi > tool/seeml/abi.json and update tool/seeml/formats.py"
            exit 1
          }
      - name: C++ reads the golden fixtures
        run: ./build/seeml_golden_fixture_test
      - name: Python holds the seam (nothing skipped — the tools are built)
        run: |
          # By discovery, as every other job runs the suite: the path form
          # (`-m unittest test/tool/x.py`) imports `test.tool.x`, and under the
          # hosted Python the standard library's own `test` package shadows
          # the repo's directory — this step had died on that import since it
          # was written, and its `! grep skipped` turned the ImportError into a
          # pass until F00 made the pipe's status count.
          python -W error -m unittest discover -s test/tool -p formats_test.py -v 2>&1 | tee seam.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "skipped" seam.log; then
            echo "::error::a seam test skipped — the tools this job builds were not found"
            exit 1
          fi
      - name: export -> compile -> dump -> validate, no torch
        run: |
          python -W error tool/export_model.py --demo-decoder out/
          ./build/seeml-update-compile --source out/decoder.smf --out out/pkg \
            --data-batch 16 --lora-rank 4 --steps 20 --no-embed --report out/report.json
          ./build/seeml-seeu-dump out/pkg/update_plan.seeu --json > out/plan.json
          python - <<'PY'
          import json
          plan, report = json.load(open("out/plan.json")), json.load(open("out/report.json"))
          assert report["schema"] == 1, report.get("schema")
          assert int(report["plan_hash"], 16) == plan["header"]["plan_hash"], "report and plan disagree"
          assert report["vendored_sources"], "the packer needs the vendored list"
          assert plan["sections"]["train"], "empty training program"
          PY

  # --- Generality: the emitted package on an Apple host (G1c, #64) ------------
  # The same package that CI builds on Linux with c++ alone must, on a Mac,
  # compile its Objective-C++ Metal backend, JIT its kernels, and — on a
  # runner that exposes no Metal device — degrade `--backend auto` to the
  # CPU with a note instead of failing. NumPy-only export (--demo-decoder)
  # keeps torch out of the job.
  e2e-package-macos:
    name: e2e package (macOS, Metal backend vendored)
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy only
        run: pip install "numpy==2.5.3"
      - name: Export the token-decoder demo (NumPy-only path)
        run: python -W error tool/export_model.py --demo-decoder out/
      - name: Build the compiler
        run: sh build/build.sh
      - name: Compile the plan and build the package (Apple branch of build.sh)
        run: |
          ./build/seeml-update-compile --source out/decoder.smf --out out/pkg \
            --data-batch 16 --loss xent --lora-rank 4 --lora-alpha 8 \
            --optimizer adamw --lr 2e-3 --steps 60 --build
          test -x out/pkg/model_update
          test -f out/pkg/runtime/executor/metal_backend.mm
          grep -q 'objective-c++' out/pkg/build.sh
      - name: --backend auto resolves and says which backend ran
        run: |
          set +e
          out/pkg/model_update --model out/decoder.smf --data out/decoder_corpus.sds \
            --out out/updated.smf --seed 7 --val-frac 0.1 --backend auto --force 2> out/auto.log
          rc=$?
          set -e
          cat out/auto.log
          test "$rc" -eq 0
          grep -Eq 'seeml-update: backend (cpu|metal) \(' out/auto.log
      - name: --backend cpu is always available; an invalid value is a usage error
        run: |
          out/pkg/model_update --model out/decoder.smf --data out/decoder_corpus.sds \
            --out out/updated_cpu.smf --seed 7 --val-frac 0.1 --backend cpu --force
          set +e
          out/pkg/model_update --model out/decoder.smf --data out/decoder_corpus.sds \
            --out out/x.smf --backend gpu 2> out/bad.log
          rc=$?
          set -e
          cat out/bad.log
          test "$rc" -eq 2
      - name: SEEML_NO_METAL builds the stub and auto degrades to cpu
        run: |
          cp -R out/pkg out/pkg_nometal
          (cd out/pkg_nometal && SEEML_NO_METAL=1 sh build.sh)
          out/pkg_nometal/model_update --model out/decoder.smf --data out/decoder_corpus.sds \
            --out out/updated_nometal.smf --seed 7 --val-frac 0.1 --backend auto --force 2> out/nometal.log
          grep -q 'no Metal device on this host; using cpu' out/nometal.log
          grep -q 'seeml-update: backend cpu' out/nometal.log

  # --- Correctness: the exporter across its NumPy floor and the pinned stack -
  # The streaming container writer and the vectorized corpus writer must
  # produce the bytes the original per-row / whole-blob algorithms did (the
  # oracles live in the suite), on NumPy 1.x under the 3.9 floor and on
  # NumPy 2.5 under 3.14.7. No torch: --demo-decoder and --corpus are the
  # NumPy-only paths, and their default outputs are pinned by digest.
  exporter-compat:
    name: exporter (py ${{ matrix.python }}, numpy ${{ matrix.numpy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", numpy: "<2" }
          - { python: "3.14.7", numpy: "==2.5.3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NumPy only
        run: pip install "numpy${{ matrix.numpy }}"
      - name: Exporter suite (oracles + golden digests, torch tests skip)
        run: python -m unittest discover -s test/tool -p 'export_model_test.py' -v
      - name: NumPy-only export paths run warning-free
        run: |
          python -W error tool/export_model.py --demo-decoder out/
          python -W error -c "import numpy as np; np.savez('out/f.npz', inputs=np.zeros((10, 4), np.float32), labels=np.arange(10) % 3)"
          python -W error tool/export_model.py --corpus out/f.npz out/f.sds
