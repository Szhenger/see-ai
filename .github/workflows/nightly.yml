# =============================================================================
# Nightly — the invariant checks too slow (or too statistical) to gate every
# pull request, run daily against main and on demand:
#
#   ThreadSanitizer   the whole suite set under TSan — the concurrency
#                     integration tests (racing durable writers, concurrent
#                     engines on the shared pool, pipeline teardown, chunk
#                     exceptions) execute with the race detector watching,
#                     turning "bounded behavior" from assertion into proof
#   extended fuzz     15 minutes over the four untrusted-input arms, with
#                     the corpus carried between runs via the actions cache
#   bench             the Tier A throughput gate: seeml-bench against the
#                     last green night on the same host (cached per host
#                     and measuring setup) and the host's epoch pinned in
#                     git; a key's first >10% regression warns, its second
#                     consecutive one fails (docs/benchmarks.md)
#   frontier          the frontier row (tool/frontier_run.py, F1 #129) on
#                     GitHub's hosted Apple-silicon runner: SmolLM-135M and
#                     the synthesized dec_wide shape, SeeAI against
#                     torch.compile and MLX-LM on the same VM; on demand
#                     with the `frontier` input, and on the schedule while
#                     the repository variable SEEML_FRONTIER_NIGHTLY is
#                     'true'. Trend only, never a gate.
#
# A nightly failure is a regression on main itself, not on a diff — treat
# it with the same severity as a red PR.
# =============================================================================

name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      reseed_baseline:
        description: >-
          Skip the Tier A gate and store this run as the new rolling
          baseline of the host it lands on (only that host's cache is
          reachable from one run; to re-seed every host at once, bump
          BENCH_GENERATION in the bench job instead). The committed epoch
          is left alone.
        type: boolean
        default: false
      frontier:
        description: >-
          Also run the frontier rows (tool/frontier_run.py, F1 #129) on
          GitHub's hosted Apple-silicon runner: SeeAI cpu / metal,
          torch.compile and MLX-LM on SmolLM-135M and on dec_wide, with
          the parity checks. Trend only.
        type: boolean
        default: false

jobs:
  frontier:
    name: Frontier rows (hosted Apple silicon, opt-in)
    # On demand with the `frontier` input, or on the schedule while the
    # repository variable SEEML_FRONTIER_NIGHTLY is 'true' (Settings >
    # Secrets and variables > Actions > Variables).
    #
    # GitHub's hosted Apple-silicon runner, not a self-hosted one (F1 #129,
    # 2026-10-30): this repository is public, and a self-hosted runner on a
    # public repository runs whatever workflow a fork's pull request brings
    # to it. The hosted VM has Apple's paravirtual GPU — SeeAI's Metal
    # backend runs there on every pull request (CI's macOS test cell) — and
    # the probe step below names what else it can run. Its numbers are a
    # VM's: the ratios inside one run are the trend; the absolute rows are
    # not comparable with docs/benchmarks.md's Apple M5 rows.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.frontier) || (github.event_name == 'schedule' && vars.SEEML_FRONTIER_NIGHTLY == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      # The SmolLM-135M revision every frontier row since 2026-09-22 used.
      SMOLLM_REPO: HuggingFaceTB/SmolLM-135M
      SMOLLM_REVISION: 1d461723eec654e65efdc40cf49301c89c0c92f4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Python plane (tier 2)
        # The releases the 2026-10-30 dec_wide column was measured with.
        run: |
          python -m pip install -r tool/requirements-pinned.txt \
            transformers==5.17.0 tokenizers==0.23.2 mlx==0.32.2 mlx-lm==0.31.3
      - name: Probe the runner
        # Every stack the matrices run is asked directly, with a real
        # kernel: a VM that cannot run one fails here, by name, rather than
        # as a refused matrix row an hour later.
        run: |
          mkdir -p out/frontier
          python - <<'EOF'
          import json, os, platform, subprocess, sys
          import mlx.core as mx
          import torch
          def sysctl(key):
              return subprocess.run(["sysctl", "-n", key], capture_output=True,
                                    text=True).stdout.strip()
          probe = {"machine": platform.machine(),
                   "cpu": sysctl("machdep.cpu.brand_string"),
                   "cores": os.cpu_count(), "memory_bytes": int(sysctl("hw.memsize")),
                   "mlx": mx.__version__, "mlx_metal": bool(mx.metal.is_available()),
                   "torch": torch.__version__,
                   "torch_mps": bool(torch.backends.mps.is_available())}
          if probe["mlx_metal"]:
              a = mx.ones((256, 256))
              mx.eval(a @ a)
              probe["mlx_device"] = str(mx.default_device())
          if probe["torch_mps"]:
              x = torch.ones(256, 256, device="mps")
              probe["torch_mps_matmul"] = float((x @ x).sum().item())
          print(json.dumps(probe, indent=1))
          with open("out/frontier/probe.json", "w") as f:
              json.dump(probe, f, indent=1)
          # MLX is the GPU comparator the hosted rows need. PyTorch MPS is
          # recorded but not run here: on this VM's paravirtual GPU, torch
          # 2.14's MPS evaluation fails to build a Metal pipeline over
          # cooperative tensors ("unsupported deferred-static-alloca-size
          # function body", dispatch of 2026-10-30), the Metal 4 tensor-op
          # family SeeAI's own relaxed GEMM library cannot build there
          # either. The torch MPS rows are taken on real Apple silicon
          # (docs/benchmarks.md).
          if not probe["mlx_metal"]:
              print("::error::the hosted runner cannot run MLX on its GPU; "
                    "the frontier rows have no GPU comparator")
              sys.exit(1)
          EOF
          echo "SEEML_THREADS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: Fetch SmolLM-135M
        run: |
          dir=$(python -c "import os; from huggingface_hub import snapshot_download; print(snapshot_download(os.environ['SMOLLM_REPO'], revision=os.environ['SMOLLM_REVISION']))")
          if [ ! -f "$dir/config.json" ]; then
            echo "::error::no SmolLM-135M checkpoint at '$dir'"
            exit 1
          fi
          echo "SMOLLM_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build the tools
        run: sh build/build.sh
      - name: Export and compile the two packages
        # The corpus is the whole docs/ tree, as the 2026-09-22 row's was
        # (~500 records of 129 ids for SmolLM): docs/usage.md alone is 58
        # records, so 300 steps of 4 are 23 epochs, the validation loss
        # rises and the gate declines — a throughput row, not a frontier
        # row. dec_wide is synthesized (tool/frontier_run.py synth: a
        # seeded Llama at the shape and a BPE tokenizer of its vocabulary)
        # and trained at 2 x 256 tokens per step, LoRA r16, f32 base.
        run: |
          mkdir -p out/frontier/smollm out/frontier/dec_wide
          cat docs/*.md > out/frontier/corpus.txt
          python tool/export_model.py --hf "$SMOLLM_DIR" out/frontier/smollm135.smf \
            --seq-len 128 --text-corpus out/frontier/corpus.txt out/frontier/docs.sds
          # --report: the seeml rows read the package's compile report (its
          # tokens per step, adapters, plan hash).
          ./build/seeml-update-compile --source out/frontier/smollm135.smf --out out/frontier/pkg/ \
            --data-batch 512 --loss xent --lora-rank 8 --lora-alpha 16 --optimizer adamw \
            --lr 1e-4 --lr-schedule const --quantize-base --steps 300 --no-embed \
            --report out/frontier/pkg/report.json
          python tool/pack_update.py out/frontier/pkg/ --build
          python tool/frontier_run.py synth --shape dec_wide --corpus out/frontier/corpus.txt \
            --out out/frontier/dec_wide_hf
          python tool/export_model.py --hf out/frontier/dec_wide_hf out/frontier/dec_wide.smf \
            --seq-len 256 --text-corpus out/frontier/corpus.txt out/frontier/dec_wide.sds --hf-parity
          ./build/seeml-update-compile --source out/frontier/dec_wide.smf --out out/frontier/pkg_dec_wide/ \
            --data-batch 512 --loss xent --lora-rank 16 --lora-alpha 32 --optimizer adamw \
            --lr 1e-4 --lr-schedule const --steps 300 --no-embed \
            --report out/frontier/pkg_dec_wide/report.json
          python tool/pack_update.py out/frontier/pkg_dec_wide/ --build
      - name: The frontier rows
        # Every row trains the 300 steps and scores the split: the parity
        # check refuses a row with no validation loss as "not a
        # measurement" and the matrix exits 3, so a throughput-only CPU
        # row (--quality-steps 0) would fail the job on every run. Both
        # matrices run, whatever the first one's verdict.
        run: |
          T="$SEEML_THREADS"
          S=out/frontier
          cat > $S/smollm/plan.json <<EOF
          {"model_dir": "$SMOLLM_DIR", "rank": 8, "rows": [
            {"kind": "seeml", "args": ["--package", "$S/pkg", "--model", "$S/smollm135.smf", "--data", "$S/docs.sds", "--backend", "metal", "--threads", "$T"]},
            {"kind": "seeml", "args": ["--package", "$S/pkg", "--model", "$S/smollm135.smf", "--data", "$S/docs.sds", "--backend", "cpu", "--lo", "15", "--hi", "45", "--repeats", "1", "--quality-steps", "300", "--threads", "$T"]},
            {"kind": "torch", "args": ["--model-dir", "$SMOLLM_DIR", "--corpus", "$S/corpus.txt", "--device", "cpu", "--compile", "1", "--dtype", "f32"]},
            {"kind": "mlx", "args": ["--model-dir", "$SMOLLM_DIR", "--corpus", "$S/corpus.txt", "--dtype", "bf16"]}
          ]}
          EOF
          cat > $S/dec_wide/plan.json <<EOF
          {"model_dir": "$S/dec_wide_hf", "rank": 16, "rows": [
            {"kind": "seeml", "args": ["--package", "$S/pkg_dec_wide", "--model", "$S/dec_wide.smf", "--data", "$S/dec_wide.sds", "--backend", "metal", "--threads", "$T"]},
            {"kind": "seeml", "args": ["--package", "$S/pkg_dec_wide", "--model", "$S/dec_wide.smf", "--data", "$S/dec_wide.sds", "--backend", "cpu", "--lo", "15", "--hi", "45", "--repeats", "1", "--quality-steps", "300", "--threads", "$T"]},
            {"kind": "torch", "args": ["--model-dir", "$S/dec_wide_hf", "--corpus", "$S/corpus.txt", "--device", "cpu", "--compile", "1", "--dtype", "f32", "--seq-len", "256", "--batch", "2", "--rank", "16", "--alpha", "32"]},
            {"kind": "mlx", "args": ["--model-dir", "$S/dec_wide_hf", "--corpus", "$S/corpus.txt", "--dtype", "bf16", "--seq-len", "256", "--batch", "2", "--rank", "16", "--alpha", "32"]},
            {"kind": "mlx", "args": ["--model-dir", "$S/dec_wide_hf", "--corpus", "$S/corpus.txt", "--dtype", "f32", "--seq-len", "256", "--batch", "2", "--rank", "16", "--alpha", "32"]}
          ]}
          EOF
          status=0
          python tool/frontier_run.py matrix $S/smollm/plan.json --out $S/smollm/frontier.json || status=1
          python tool/frontier_run.py matrix $S/dec_wide/plan.json --out $S/dec_wide/frontier.json || status=1
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-rows
          path: |
            out/frontier/*.json
            out/frontier/*/*.json

  tsan:
    name: ThreadSanitizer (full suites)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CXX: clang++-19
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 120 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSEEML_SANITIZE=thread
      - name: Build
        run: cmake --build build-tsan -j "$(nproc)"
      - name: Test under TSan
        run: ctest --test-dir build-tsan --output-on-failure

  fuzz-extended:
    name: fuzz (15 min, cached corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 120 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Configure
        run: cmake -S . -B build-fuzz -DSEEML_FUZZ=ON
      - name: Build harness
        run: cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_formats
      - name: Fuzz
        run: |
          mkdir -p corpus
          ./build-fuzz/seeml_fuzz_formats -max_total_time=900 \
            -print_final_stats=1 corpus
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  # The Tier A regression gate of docs/benchmarks.md: run the harness, diff
  # against the last green night's numbers (carried by the actions cache,
  # the fuzz-corpus trust model). Cloud runners of one class differ by
  # 15-35% on identical work, so the gate is calibration-normalized and
  # two-consecutive-red (P5, #79): seeml-bench times a frozen reference
  # kernel, bench_compare.py divides the runner out of every delta, a key's
  # first >10% regression is a warning and its second consecutive one fails
  # the job. bench_compare.py --promote owns the baseline roll: only a fully
  # green gate replaces it, so a warned night is never the next reference.
  # The calibration transfers within one CPU model, not between them (P8,
  # #165: ubuntu-latest rotates across six, and every red from 2026-10-08
  # to 10-22 was measured against another model's baseline), so the
  # rolling baseline and the gate state are cached per host: the harness
  # runs first and bench_compare.py names the cache key segment. The key
  # also carries the release, the kernel policy and the calibration kernel
  # (a change in any of them re-seeds every host at once, where one rolling
  # baseline per host would fail each host closed until a reseed dispatch
  # happened to land on it) and BENCH_GENERATION, bumped by hand to re-seed
  # every host after a fixture or metric rename. Segments are joined by
  # "--", which no slug contains, so no key is a prefix of another host's,
  # and the stem is bench-rolling-, which the restore prefix of the old
  # single-baseline workflow (bench-baseline-) cannot match. The state is
  # saved after every gate, failed ones included, so a cleared red names
  # the night it was red on. The epoch is not cached at all: the actions
  # cache evicts an entry unused for seven days, and an epoch that re-seeds
  # after every lapse rolls forward. Each host's epoch is a report
  # committed at docs/ledger/bench-epochs/<host slug>.json; a host without
  # one runs the rolling gate only, with a notice, and so does a host whose
  # epoch was measured under another kernel policy or calibration kernel,
  # until it is re-pinned (another host's epoch there still fails closed).
  bench:
    name: bench (Tier A regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CXX: clang++-19
      BENCH_GENERATION: g1
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          # apt-get has no timeout of its own: on 2026-10-22 the first
          # attempt's update sat 8 minutes after noble-security InRelease
          # and the step timed out before the loop could retry. Every
          # fetch and every attempt is bounded (a green attempt is 18-52 s).
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' |
            sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          attempt() {
            wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all
          }
          for i in 1 2 3; do
            if timeout 120 bash -ec "$(declare -f attempt); attempt"; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-bench
          -DCMAKE_BUILD_TYPE=Release
          -DSEEML_BENCH=ON
      - name: Build harness
        run: cmake --build build-bench -j "$(nproc)" --target seeml-bench
      - name: Bench
        run: ./build-bench/seeml-bench --out bench.json --threads 1,2,4
      # The host and measuring setup, as the report names them, key the
      # rolling cache below and name the committed epoch.
      - name: Name the runner's host
        run: |
          slug=$(python3 tool/bench_compare.py --host-slug bench.json)
          key=$(python3 tool/bench_compare.py --cache-key bench.json)
          echo "runner host: $slug; rolling key segment: $key"
          echo "BENCH_HOST=$slug" >> "$GITHUB_ENV"
          echo "BENCH_KEY=bench-rolling-$BENCH_GENERATION--$key--" >> "$GITHUB_ENV"
      - name: Restore baseline (this host's)
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline
          key: ${{ env.BENCH_KEY }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.BENCH_KEY }}
      # A reseed drops the rolling baseline and the pending reds, never the
      # committed epoch; the gate step then seeds from this run.
      - name: Drop the baseline (reseed only)
        if: ${{ inputs.reseed_baseline }}
        run: rm -f bench-baseline/bench.json bench-baseline/gate_state.json
      - name: Gate against baseline
        id: gate
        run: |
          epoch="--epoch-baseline docs/ledger/bench-epochs/$BENCH_HOST.json"
          if [ "${{ inputs.reseed_baseline }}" = "true" ]; then epoch=""; fi
          python3 tool/bench_compare.py bench-baseline/bench.json bench.json \
            $epoch --state bench-baseline/gate_state.json --promote \
            --sha "${{ github.sha }}" \
            | tee bench-gate.log
          exit "${PIPESTATUS[0]}"
      # Saved whatever the verdict: a red never promotes bench.json, and the
      # state of a FAIL night is what the next night must read. The attempt
      # joins the key: a re-run's save must not collide with the first
      # attempt's entry (an existing key is skipped, losing the state).
      - name: Save baseline and gate state
        if: always() && steps.gate.outcome != 'skipped' && hashFiles('bench-baseline/**') != ''
        uses: actions/cache/save@v4
        with:
          path: bench-baseline
          key: ${{ env.BENCH_KEY }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench
          path: |
            bench.json
            bench-gate.log
            bench-baseline/gate_state.json
          if-no-files-found: ignore
