# =============================================================================
# Nightly — the invariant checks too slow (or too statistical) to gate every
# pull request, run daily against main and on demand:
#
#   ThreadSanitizer   the whole suite set under TSan — the concurrency
#                     integration tests (racing durable writers, concurrent
#                     engines on the shared pool, pipeline teardown, chunk
#                     exceptions) execute with the race detector watching,
#                     turning "bounded behavior" from assertion into proof
#   extended fuzz     15 minutes over the four untrusted-input arms, with
#                     the corpus carried between runs via the actions cache
#   bench             the Tier A throughput gate: seeml-bench against the
#                     previous night's cached baseline, >10% rows/s
#                     regression fails (docs/benchmarks.md)
#
# A nightly failure is a regression on main itself, not on a diff — treat
# it with the same severity as a red PR.
# =============================================================================

name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      reseed_baseline:
        description: >-
          Skip the Tier A gate and store this run as the new rolling
          baseline (after a fixture/metric rename the fail-closed gate
          would otherwise stay red; the epoch baseline is left alone).
        type: boolean
        default: false
      frontier:
        description: >-
          Also run the frontier row (tool/frontier_run.py, F1 #129) on a
          self-hosted Apple-silicon runner: SeeAI cpu / metal, torch.compile
          and MLX-LM on SmolLM-135M with the parity checks. Trend only.
        type: boolean
        default: false
      frontier_model_dir:
        description: >-
          The SmolLM-135M Hugging Face checkpoint directory on the
          self-hosted runner (config.json, model.safetensors, the
          tokenizer files). Empty: the runner's SEEML_FRONTIER_MODEL_DIR.
        type: string
        default: ""

jobs:
  frontier:
    name: Frontier row (self-hosted Apple silicon, opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.frontier }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Locate the checkpoint
        # The job's one external input. Fail here, by name, rather than
        # inside the exporter with an empty path.
        env:
          # Through the environment, never spliced into the script text.
          INPUT_MODEL_DIR: ${{ inputs.frontier_model_dir }}
        run: |
          dir="${INPUT_MODEL_DIR:-}"
          [ -n "$dir" ] || dir="${SEEML_FRONTIER_MODEL_DIR:-}"
          if [ -z "$dir" ] || [ ! -f "$dir/config.json" ]; then
            echo "::error::no SmolLM-135M checkpoint: pass frontier_model_dir or set SEEML_FRONTIER_MODEL_DIR in the runner's environment (got '$dir')"
            exit 1
          fi
          echo "SEEML_FRONTIER_MODEL_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build the tools
        run: sh build/build.sh
      - name: Python plane (tier 2)
        run: |
          python3 -m pip install --user -r tool/requirements-pinned.txt \
            transformers tokenizers mlx mlx-lm
      - name: Export SmolLM-135M and compile the package
        # The corpus is the whole docs/ tree, as the 2026-09-22 row's was
        # (~500 records of 129 ids): docs/usage.md alone is 58 records, so
        # 300 steps of 4 are 23 epochs, the validation loss rises and the
        # gate declines — a throughput row, not a frontier row.
        run: |
          mkdir -p out/frontier
          cat docs/*.md > out/frontier/corpus.txt
          python3 tool/export_model.py --hf "$SEEML_FRONTIER_MODEL_DIR" out/frontier/smollm135.smf \
            --seq-len 128 --text-corpus out/frontier/corpus.txt out/frontier/docs.sds
          ./build/seeml-update-compile --source out/frontier/smollm135.smf --out out/frontier/pkg/ \
            --data-batch 512 --loss xent --lora-rank 8 --lora-alpha 16 --optimizer adamw \
            --lr 1e-4 --lr-schedule const --quantize-base --steps 300 --no-embed
          python3 tool/pack_update.py out/frontier/pkg/ --build
      - name: The frontier row
        # Every row trains the 300 steps and scores the split: the parity
        # check refuses a row with no validation loss as "not a
        # measurement" and the matrix exits 3, so a throughput-only CPU
        # row (--quality-steps 0) would fail the job on every run.
        env:
          SEEML_THREADS: "10"
        run: |
          cat > out/frontier/plan.json <<EOF
          {"model_dir": "$SEEML_FRONTIER_MODEL_DIR", "rank": 8, "rows": [
            {"kind": "seeml", "args": ["--package", "out/frontier/pkg", "--model", "out/frontier/smollm135.smf", "--data", "out/frontier/docs.sds", "--backend", "metal", "--threads", "10"]},
            {"kind": "seeml", "args": ["--package", "out/frontier/pkg", "--model", "out/frontier/smollm135.smf", "--data", "out/frontier/docs.sds", "--backend", "cpu", "--lo", "15", "--hi", "45", "--repeats", "1", "--quality-steps", "300", "--threads", "10"]},
            {"kind": "torch", "args": ["--model-dir", "$SEEML_FRONTIER_MODEL_DIR", "--corpus", "out/frontier/corpus.txt", "--device", "mps", "--compile", "1", "--dtype", "bf16"]},
            {"kind": "torch", "args": ["--model-dir", "$SEEML_FRONTIER_MODEL_DIR", "--corpus", "out/frontier/corpus.txt", "--device", "cpu", "--compile", "1", "--dtype", "f32"]},
            {"kind": "mlx", "args": ["--model-dir", "$SEEML_FRONTIER_MODEL_DIR", "--corpus", "out/frontier/corpus.txt", "--dtype", "bf16"]}
          ]}
          EOF
          python3 tool/frontier_run.py matrix out/frontier/plan.json --out out/frontier/frontier.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-row
          path: out/frontier/*.json

  tsan:
    name: ThreadSanitizer (full suites)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CXX: clang++-19
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSEEML_SANITIZE=thread
      - name: Build
        run: cmake --build build-tsan -j "$(nproc)"
      - name: Test under TSan
        run: ctest --test-dir build-tsan --output-on-failure

  fuzz-extended:
    name: fuzz (15 min, cached corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Configure
        run: cmake -S . -B build-fuzz -DSEEML_FUZZ=ON
      - name: Build harness
        run: cmake --build build-fuzz -j "$(nproc)" --target seeml_fuzz_formats
      - name: Fuzz
        run: |
          mkdir -p corpus
          ./build-fuzz/seeml_fuzz_formats -max_total_time=900 \
            -print_final_stats=1 corpus
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  # The Tier A regression gate of docs/benchmarks.md: run the harness, diff
  # against the last green night's numbers (carried by the actions cache,
  # the fuzz-corpus trust model). Cloud runners of one class differ by
  # 15-35% on identical work, so the gate is calibration-normalized and
  # two-consecutive-red (P5, #79): seeml-bench times a frozen reference
  # kernel, bench_compare.py divides the runner out of every delta, a key's
  # first >10% regression is a warning and its second consecutive one fails
  # the job. bench_compare.py --promote owns the baseline roll: only a fully
  # green gate replaces it, so a warned night is never the next reference.
  # The calibration transfers within one CPU model, not between them (P8,
  # #165: ubuntu-latest rotates across five, and every red from 2026-10-08
  # to 10-22 was an Intel Xeon measured against an AMD EPYC's baseline at
  # an unchanged commit), so the baselines, the epoch and the gate state
  # are cached per model: the harness runs first, bench_compare.py names
  # the model's slug, and the caches restore under it. A model's first
  # night seeds its own baseline; bench_compare.py refuses a baseline from
  # another model, so a wrong key fails loudly rather than compares.
  bench:
    name: bench (Tier A regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - name: Pin the Linux toolchain
        timeout-minutes: 6
        run: |
          # The runner image ships third-party apt sources (Google Chrome,
          # Microsoft) that nothing here needs, and a stale index on any of
          # them fails every apt-get update -- including the one inside
          # llvm.sh (observed 2026-09-09: a dl.google.com "Hash Sum
          # mismatch" took down all seven Linux jobs). Keep Ubuntu's own
          # archive only; llvm.sh adds its source afterwards.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          for i in 1 2 3; do
            if wget -T 30 -t 1 -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19 all; then
              exit 0
            fi
            echo "apt.llvm.org attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build-bench
          -DCMAKE_BUILD_TYPE=Release
          -DSEEML_BENCH=ON
      - name: Build harness
        run: cmake --build build-bench -j "$(nproc)" --target seeml-bench
      - name: Bench
        run: ./build-bench/seeml-bench --out bench.json --threads 1,2,4
      # The runner's CPU model, as the report names it, keys every cache
      # below: one rolling baseline, epoch and gate state per model.
      - name: Name the runner's CPU model
        run: |
          slug=$(python3 tool/bench_compare.py --host-slug bench.json)
          echo "runner model: $slug ($(python3 -c 'import json; print(json.load(open("bench.json")).get("host_key"))'))"
          echo "BENCH_HOST=$slug" >> "$GITHUB_ENV"
      - name: Restore baseline (this CPU model's)
        uses: actions/cache@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ env.BENCH_HOST }}-${{ github.run_id }}
          restore-keys: bench-baseline-${{ env.BENCH_HOST }}-
      # The pinned epoch: a fixed cache key is saved once and never
      # overwritten, so the gate also diffs against a reference that does
      # not roll forward (a <10%/night drift cannot compound past it).
      # Bump the key suffix to start a new epoch deliberately (v2: the
      # first epoch that carries a calibration block — v1 was an
      # un-normalizable high-water mark from one fast runner; v3: one
      # epoch per CPU model, seeded by each model's first green night).
      - name: Restore epoch baseline (this CPU model's)
        uses: actions/cache@v4
        with:
          path: bench-epoch
          key: bench-epoch-v3-${{ env.BENCH_HOST }}
      # A reseed drops the rolling baseline and the pending reds, never the
      # epoch (bump its key instead); the gate step then seeds from this run.
      - name: Drop the baseline (reseed only)
        if: ${{ inputs.reseed_baseline }}
        run: rm -f bench-baseline/bench.json bench-baseline/gate_state.json
      - name: Gate against baseline
        run: |
          epoch="--epoch-baseline bench-epoch/bench.json"
          if [ "${{ inputs.reseed_baseline }}" = "true" ]; then epoch=""; fi
          python3 tool/bench_compare.py bench-baseline/bench.json bench.json \
            $epoch --state bench-baseline/gate_state.json --promote \
            --sha "${{ github.sha }}" \
            | tee bench-gate.log
          exit "${PIPESTATUS[0]}"
      - name: Upload run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench
          path: |
            bench.json
            bench-gate.log
            bench-baseline/gate_state.json
          if-no-files-found: ignore
